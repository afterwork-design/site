幕之下\",\"level\":1,\"href\":\"#插画-夜幕之下\"}],\"title\":\"【插画】夜幕之下\",\"images\":[{\"alt\":\"绘制过程\",\"src\":\"https://tangweijuan.github.io/blog/image/old/20210727222057.jpg\"}]},{\"url\":\"Chinese-style\",\"date\":\"2021/9/16\",\"image\":\"/assests/blog/image/old/20210518221043.png\",\"markdown\":\"# 插画 | 水月镜花\\r\\n\\r\\n灵感来自于孙郡给刘雯拍摄的国风大片\\r\\n\\r\\n![古风](https://tangweijuan.github.io/blog/image/old/20210518221043.png)\\r\\n\",\"htmlContent\":\"\\n                    \u003ch1 id=\\\"插画-水月镜花\\\"\u003e\\n                        \u003ca href=\\\"#插画-水月镜花\\\"\u003e插画 | 水月镜花\u003c/a\u003e\\n                    \u003c/h1\u003e\\n                \u003cp\u003e灵感来自于孙郡给刘雯拍摄的国风大片\u003c/p\u003e\\n\u003cp\u003e\u003cimg src=\\\"https://tangweijuan.github.io/blog/image/old/20210518221043.png\\\" alt=\\\"古风\\\"\u003e\u003c/p\u003e\\n\",\"toc\":[{\"title\":\"插画 | 水月镜花\",\"level\":1,\"href\":\"#插画-水月镜花\"}],\"title\":\"【插画】水月镜花\",\"images\":[{\"alt\":\"古风\",\"src\":\"https://tangweijuan.github.io/blog/image/old/20210518221043.png\"}]},{\"url\":\"solar-term-mangzhong\",\"date\":\"2021/9/14\",\"image\":\"/assests/blog/image/old/20210530211543.jpg\",\"markdown\":\"# 节气插画 | 芒种\\r\\n\\r\\n**小科普：** 芒种一词，最早出周礼的“泽草所生，种之芒种。”东汉郑玄的解释是，“泽草之所生，其地可种芒种，芒种，稻麦也”。芒种有三候，一候“螳螂生”，二候“䴗（jú）始鸣”，三候“反舌无声”。\\r\\n\\r\\n芒种，字面意思是“有芒的麦子快收，有芒的稻子可种”，因此“芒种”又叫“忙种”，是一个典型反映农业物候现象的节气，是二十四节气中的第九个节气，夏季的第三个节气 。每年6月5日或6日太阳达到黄经75度便为芒种。芒种的气候特点是气温显著升高，雨量充沛，空气湿度大。\\r\\n\\r\\n![芒种](https://tangweijuan.github.io/blog/image/old/20210530211543.jpg)\\r\\n\",\"htmlContent\":\"\\n                    \u003ch1 id=\\\"节气插画-芒种\\\"\u003e\\n                        \u003ca href=\\\"#节气插画-芒种\\\"\u003e节气插画 | 芒种\u003c/a\u003e\\n                    \u003c/h1\u003e\\n                \u003cp\u003e\u003cstrong\u003e小科普：\u003c/strong\u003e 芒种一词，最早出周礼的“泽草所生，种之芒种。”东汉郑玄的解释是，“泽草之所生，其地可种芒种，芒种，稻麦也”。芒种有三候，一候“螳螂生”，二候“䴗（jú）始鸣”，三候“反舌无声”。\u003c/p\u003e\\n\u003cp\u003e芒种，字面意思是“有芒的麦子快收，有芒的稻子可种”，因此“芒种”又叫“忙种”，是一个典型反映农业物候现象的节气，是二十四节气中的第九个节气，夏季的第三个节气 。每年6月5日或6日太阳达到黄经75度便为芒种。芒种的气候特点是气温显著升高，雨量充沛，空气湿度大。\u003c/p\u003e\\n\u003cp\u003e\u003cimg src=\\\"https://tangweijuan.github.io/blog/image/old/20210530211543.jpg\\\" alt=\\\"芒种\\\"\u003e\u003c/p\u003e\\n\",\"toc\":[{\"title\":\"节气插画 | 芒种\",\"level\":1,\"href\":\"#节气插画-芒种\"}],\"title\":\"【节气插画】芒种\",\"images\":[{\"alt\":\"芒种\",\"src\":\"https://tangweijuan.github.io/blog/image/old/20210530211543.jpg\"}]},{\"url\":\"watercolor-ins-plant\",\"date\":\"2021/9/12\",\"image\":\"/assests/work/image/尤加利叶水彩.jpg\",\"markdown\":\"# 水彩-ins风植物\\r\\n\\r\\n\\r\\n\\r\\n![img](https://api2.mubu.com/v3/document_image/E74B843C39DE47F01625061876.jpg)\\r\\n\\r\\n![img](https://api2.mubu.com/v3/document_image/935A2B912B794EEB1625061876.jpg)\\r\\n\\r\\n![img](https://api2.mubu.com/v3/document_image/3D8D557E545A451D1625061877.jpg)\\r\\n\\r\\n![img](https://api2.mubu.com/v3/document_image/C1005075C3C647FE1625147725.jpg)\\r\\n\\r\\n![img](https://api2.mubu.com/v3/document_image/358D91271B034C011625231252.jpg)\",\"htmlContent\":\"\\n                    \u003ch1 id=\\\"水彩-ins风植物\\\"\u003e\\n                        \u003ca href=\\\"#水彩-ins风植物\\\"\u003e水彩-ins风植物\u003c/a\u003e\\n                    \u003c/h1\u003e\\n                \u003cp\u003e\u003cimg src=\\\"https://api2.mubu.com/v3/document_image/E74B843C39DE47F01625061876.jpg\\\" alt=\\\"img\\\"\u003e\u003c/p\u003e\\n\u003cp\u003e\u003cimg src=\\\"https://api2.mubu.com/v3/document_image/935A2B912B794EEB1625061876.jpg\\\" alt=\\\"img\\\"\u003e\u003c/p\u003e\\n\u003cp\u003e\u003cimg src=\\\"https://api2.mubu.com/v3/document_image/3D8D557E545A451D1625061877.jpg\\\" alt=\\\"img\\\"\u003e\u003c/p\u003e\\n\u003cp\u003e\u003cimg src=\\\"https://api2.mubu.com/v3/document_image/C1005075C3C647FE1625147725.jpg\\\" alt=\\\"img\\\"\u003e\u003c/p\u003e\\n\u003cp\u003e\u003cimg src=\\\"https://api2.mubu.com/v3/document_image/358D91271B034C011625231252.jpg\\\" alt=\\\"img\\\"\u003e\u003c/p\u003e\\n\",\"toc\":[{\"title\":\"水彩-ins风植物\",\"level\":1,\"href\":\"#水彩-ins风植物\"}],\"titl
